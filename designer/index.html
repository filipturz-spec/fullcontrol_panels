<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Partition Screen Designer</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/paper.js/0.12.17/paper-full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#1a1a1e;--sf:#26262e;--sf2:#2e2e38;--bd:#3a3a48;
  --ac:#7c6fff;--ac2:#a89bff;--tx:#e0dff8;--dm:#8888aa;
  --danger:#ff6b6b;--r:6px;
}
body{background:var(--bg);color:var(--tx);font-family:system-ui,sans-serif;font-size:13px;height:100vh;overflow:hidden}
#app{display:flex;height:100vh}
.hidden{display:none!important}

/* ── Sidebar ── */
#sidebar{width:380px;min-width:380px;background:var(--sf);border-right:1px solid var(--bd);display:flex;flex-direction:column;overflow:hidden}
.sb-hdr{padding:11px 12px;border-bottom:1px solid var(--bd);flex-shrink:0;font-weight:700;font-size:13px;color:var(--ac2);letter-spacing:.02em}
.sb-sec{padding:10px 12px;border-bottom:1px solid var(--bd);flex-shrink:0}
.sec-title{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--dm);margin-bottom:8px}
.panel-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.pi{display:flex;flex-direction:column;gap:3px}
.pi label{font-size:10px;color:var(--dm)}
.pi input{background:var(--sf2);border:1px solid var(--bd);color:var(--tx);border-radius:4px;padding:4px 6px;font-size:12px;width:100%}

/* ── Layers ── */
#layers-area{flex:1;display:flex;flex-direction:column;overflow:hidden}
#layers-toolbar{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;border-bottom:1px solid var(--bd);flex-shrink:0;position:relative}
#add-btn{background:var(--ac);color:#fff;border:none;border-radius:var(--r);padding:4px 11px;cursor:pointer;font-size:11px;font-weight:600}
#add-btn:hover{opacity:.85}
#gen-picker{position:absolute;top:calc(100% + 2px);right:12px;background:var(--sf2);border:1px solid var(--bd);border-radius:var(--r);z-index:200;min-width:170px;padding:4px 0;box-shadow:0 8px 24px rgba(0,0,0,.6)}
#gen-picker div{padding:8px 14px;cursor:pointer;font-size:12px;display:flex;align-items:center;gap:10px}
#gen-picker div:hover{background:var(--bd)}
#gen-picker .gi{font-size:17px;width:22px;text-align:center}
#layers-list{flex:1;overflow-y:auto;padding:6px}
.empty-msg{text-align:center;color:var(--dm);padding:24px 12px;font-size:12px;line-height:1.8}

/* ── Layer card ── */
.lcard{margin-bottom:4px;background:var(--sf2);border:1px solid var(--bd);border-radius:var(--r);overflow:hidden}
.lhead{display:flex;align-items:center;gap:6px;padding:7px 8px;cursor:pointer;user-select:none}
.lhead:hover{background:rgba(255,255,255,.04)}
.badge{font-size:10px;font-weight:700;text-transform:uppercase;color:var(--ac2);background:rgba(124,111,255,.15);padding:1px 5px;border-radius:3px;flex-shrink:0;letter-spacing:.04em}
.lname{flex:1;font-size:12px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chev{font-size:9px;color:var(--dm);transition:transform .15s;flex-shrink:0}
.lcard.open .chev{transform:rotate(90deg)}
.delbtn,.copybtn,.visbtn{background:none;border:none;color:var(--dm);cursor:pointer;font-size:13px;line-height:1;padding:2px 4px;border-radius:3px;flex-shrink:0}
.delbtn:hover{background:var(--danger);color:#fff}
.copybtn:hover{background:var(--ac);color:#fff}
.visbtn{font-size:11px}
.visbtn.on{color:var(--ac)}
.visbtn.off{color:var(--bd)}
.visbtn:hover{background:var(--sf2);color:var(--dm)}
.lbody{display:none;padding:8px 10px 10px;border-top:1px solid var(--bd)}
.lcard.open .lbody{display:block}

/* ── Controls ── */
.csec{margin-bottom:10px}
.csec:last-child{margin-bottom:0}
.ctitle{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--dm);margin-bottom:6px;padding-bottom:3px;border-bottom:1px solid var(--bd)}
.crow{display:flex;align-items:center;gap:6px;margin-bottom:5px}
.clbl{width:106px;flex-shrink:0;color:var(--dm);font-size:11px}
.cslider{flex:1;accent-color:var(--ac)}
.cnum{width:44px;background:var(--sf);border:1px solid var(--bd);color:var(--tx);border-radius:3px;padding:2px 4px;font-size:11px;text-align:right}
.csel{flex:1;background:var(--sf);border:1px solid var(--bd);color:var(--tx);border-radius:3px;padding:3px 5px;font-size:11px}
.ccol{flex:1;height:24px;border:none;background:none;cursor:pointer;border-radius:3px}
.cchk{display:flex;align-items:center;gap:8px;margin-bottom:5px;font-size:11px;color:var(--dm);cursor:pointer}
.cchk input{accent-color:var(--ac)}

/* ── Footer ── */
#sb-foot{padding:8px 10px;border-top:1px solid var(--bd);display:flex;gap:5px;flex-shrink:0}
#sb-foot button,.load-lbl{flex:1;background:var(--sf2);border:1px solid var(--bd);color:var(--tx);border-radius:var(--r);padding:5px 4px;font-size:10px;cursor:pointer;text-align:center;white-space:nowrap}
#sb-foot button:hover,.load-lbl:hover{border-color:var(--ac);color:var(--ac)}
#btn-export{font-weight:600}

/* ── Canvas area ── */
#canvas-wrap{flex:1;display:flex;flex-direction:row;overflow:hidden;background:var(--bg)}
#view-2d{display:flex;flex-direction:column;flex:0 0 auto;overflow:hidden;border-right:1px solid var(--bd)}
#canvas-toolbar{min-height:38px;display:flex;align-items:center;gap:10px;padding:0 14px;border-bottom:1px solid var(--bd);background:var(--sf);flex-shrink:0;font-size:11px;color:var(--dm);flex-wrap:wrap}
#canvas-toolbar label{display:flex;align-items:center;gap:5px;white-space:nowrap}
#border-opts{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
#border-opts .bsep{color:var(--bd)}
.bwall{display:flex;align-items:center;gap:3px;cursor:pointer;font-size:10px;color:var(--dm)}
#b-sw,#warp-num{width:36px;background:var(--sf2);border:1px solid var(--bd);color:var(--tx);border-radius:3px;padding:2px 4px;font-size:11px;text-align:right}
#warp-slider{width:80px;accent-color:var(--ac);cursor:pointer}
#canvas-scroll{flex:1;overflow:hidden;padding:24px;display:flex;justify-content:center;align-items:flex-start}
#canvas-inner{display:inline-block;box-shadow:0 4px 32px rgba(0,0,0,.7)}
canvas{display:block;background:#1e1c18}
/* ── 3D view ── */
#view-3d{flex:1;display:flex;flex-direction:column;overflow:hidden}
#view3d-bar{height:38px;display:flex;align-items:center;padding:0 14px;gap:8px;border-bottom:1px solid var(--bd);background:var(--sf);flex-shrink:0;font-size:11px;font-weight:600;color:var(--ac2)}
#view3d-bar .hint{font-weight:400;font-size:10px;color:var(--dm)}
#depth-lbl{margin-left:auto;font-weight:400;font-size:10px;color:var(--dm);display:flex;align-items:center;gap:4px}
#depth-lbl input{width:38px;background:var(--sf2);border:1px solid var(--bd);color:var(--tx);border-radius:3px;padding:2px 4px;font-size:11px;text-align:right}
#three-mount{flex:1;overflow:hidden}
::-webkit-scrollbar{width:5px;height:5px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--bd);border-radius:3px}

/* ── Fabricate panel ── */
#fab-sec{border-bottom:1px solid var(--bd);flex-shrink:0}
#fab-hdr{padding:8px 12px;cursor:pointer;display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;color:var(--ac2);letter-spacing:.03em;user-select:none}
#fab-hdr:hover{background:var(--sf2)}
#fab-chev{margin-left:auto;font-size:12px;color:var(--dm);transition:transform .15s}
#fab-sec.open #fab-chev{transform:rotate(90deg)}
#fab-body{display:none;padding:8px 12px 10px}
#fab-sec.open #fab-body{display:block}
.fab-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-bottom:6px}
.fab-row{display:flex;flex-direction:column;gap:2px}
.fab-row label{font-size:10px;color:var(--dm)}
.fab-row input,.fab-row select{background:var(--sf2);border:1px solid var(--bd);color:var(--tx);border-radius:3px;padding:3px 5px;font-size:11px;width:100%}
.fab-toggle{font-size:10px;color:var(--dm);cursor:pointer;margin-bottom:4px;user-select:none}
.fab-toggle:hover{color:var(--ac2)}
.fab-gcode{display:none;margin-top:4px}
.fab-gcode.open{display:block}
.fab-gcode textarea{width:100%;background:var(--sf2);border:1px solid var(--bd);color:var(--tx);border-radius:3px;padding:4px 6px;font-size:10px;font-family:monospace;resize:vertical;min-height:54px}
.fab-gcode label{font-size:10px;color:var(--dm);display:block;margin-bottom:2px;margin-top:6px}

/* ── Face tabs ── */
#face-tabs-bar{display:flex;gap:3px;padding:8px 12px;border-bottom:1px solid var(--bd);flex-shrink:0}
.ftab{flex:1;background:var(--sf2);border:1px solid var(--bd);color:var(--dm);border-radius:var(--r);padding:5px 0;font-size:11px;font-weight:600;cursor:pointer;text-align:center;transition:background .1s,color .1s,border-color .1s}
.ftab.active{background:var(--ac);border-color:var(--ac);color:#fff}
.ftab:not(.active):hover{color:var(--ac2);border-color:var(--ac2)}
.back-same{color:var(--dm);font-size:11px;padding:3px 0;font-style:italic}
</style>
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="sb-hdr">Screen Designer</div>

    <div class="sb-sec">
      <div class="sec-title">Panel</div>
      <div class="panel-grid">
        <div class="pi"><label>Width (cm)</label><input id="s-pw" type="number" value="120" min="10" max="600"></div>
        <div class="pi"><label>Height (cm)</label><input id="s-ph" type="number" value="180" min="10" max="600"></div>
      </div>
    </div>

    <div id="layers-area">
      <div id="face-tabs-bar">
        <button class="ftab active" data-tab="front">▣ Front</button>
        <button class="ftab"        data-tab="back" >◧ Back</button>
      </div>
      <div id="layers-toolbar">
        <span class="sec-title" style="margin:0">Layers</span>
        <button id="add-btn">+ Add Layer</button>
        <div id="gen-picker" class="hidden">
          <div data-gen="straight"><span class="gi">│</span>Straight</div>
          <div data-gen="sine"><span class="gi">∿</span>Sine Wave</div>
          <div data-gen="bezier"><span class="gi">〜</span>Bézier</div>
          <div data-gen="arch"><span class="gi">⌒</span>Arch</div>
          <div data-gen="square"><span class="gi">⊓</span>Square Wave</div>
          <div data-gen="circle"><span class="gi">○</span>Circle</div>
        </div>
      </div>
      <div id="layers-list">
        <div class="empty-msg">No layers yet.<br>Click <strong>+ Add Layer</strong> to begin.</div>
      </div>
    </div>

    <div id="fab-sec">
      <div id="fab-hdr">⬡ Fabricate <span id="fab-chev">›</span></div>
      <div id="fab-body">
        <div class="fab-grid">
          <div class="fab-row"><label>Depth (mm)</label><input id="fab-depth" type="number" value="30" min="1" max="500" step="1"></div>
          <div class="fab-row"><label>Layer height (mm)</label><input id="fab-lh" type="number" value="2" min="0.1" max="20" step="0.1"></div>
          <div class="fab-row"><label>Line width (mm)</label><input id="fab-lw" type="number" value="1.0" min="0.1" max="10" step="0.1"></div>
          <div class="fab-row"><label>Filament Ø (mm)</label><input id="fab-fd" type="number" value="1.75" min="1" max="3.5" step="0.05"></div>
          <div class="fab-row"><label>Print speed (mm/s)</label><input id="fab-ps" type="number" value="40" min="1" max="500" step="1"></div>
          <div class="fab-row"><label>Travel speed (mm/s)</label><input id="fab-ts" type="number" value="120" min="1" max="500" step="1"></div>
          <div class="fab-row"><label>Nozzle temp (°C)</label><input id="fab-nt" type="number" value="220" min="0" max="400" step="1"></div>
          <div class="fab-row"><label>Bed temp (°C)</label><input id="fab-bt" type="number" value="60" min="0" max="200" step="1"></div>
        </div>
        <div class="fab-toggle" id="fab-gc-toggle">▸ Custom start / end GCode</div>
        <div class="fab-gcode" id="fab-gc-panel">
          <label>Start GCode (leave blank for defaults)</label>
          <textarea id="fab-start" placeholder="G28&#10;G92 E0&#10;..."></textarea>
          <label>End GCode (leave blank for defaults)</label>
          <textarea id="fab-end" placeholder="M104 S0&#10;G28 X Y&#10;M84"></textarea>
        </div>
      </div>
    </div>

    <div id="sb-foot">
      <button id="btn-export">SVG</button>
      <button id="btn-save">JSON</button>
      <button id="btn-gcode">GCode</button>
      <label class="load-lbl">Load<input type="file" id="file-load" accept=".json" style="display:none"></label>
    </div>
  </aside>

  <main id="canvas-wrap">
    <div id="view-2d">
      <div id="canvas-toolbar">
        <label><input type="checkbox" id="show-grid" checked> Border</label>
        <span id="border-opts">
          <span class="bsep">|</span>
          Walls
          <label class="bwall"><input type="checkbox" id="bw-top"    checked><span>T</span></label>
          <label class="bwall"><input type="checkbox" id="bw-right"  checked><span>R</span></label>
          <label class="bwall"><input type="checkbox" id="bw-bottom" checked><span>B</span></label>
          <label class="bwall"><input type="checkbox" id="bw-left"   checked><span>L</span></label>
          <span class="bsep">|</span>
          Width <input type="number" id="b-sw" min="0.1" max="10" step="0.1" value="0.5"> cm
        </span>
        <span class="bsep">|</span>
        Lines <input type="color" id="line-color" value="#aaaaaa" title="Line colour for all layers">
        <span class="bsep">|</span>
        Bow <input type="range" id="warp-slider" min="-30" max="30" step="1" value="0">
        <input type="number" id="warp-num" min="-30" max="30" step="1" value="0"> cm
      </div>
      <div id="canvas-scroll">
        <div id="canvas-inner"><canvas id="cv"></canvas></div>
      </div>
    </div>
    <div id="view-3d">
      <div id="view3d-bar">
        3D Preview
        <span class="hint">drag · rotate &nbsp;|&nbsp; scroll · zoom &nbsp;|&nbsp; right-drag · pan</span>
        <label id="depth-lbl">Depth <input id="s-depth" type="number" min="1" max="50" step="0.5" value="3"> cm</label>
      </div>
      <div id="three-mount"></div>
    </div>
  </main>
</div>

<script>
'use strict';

// ── Constants & state ────────────────────────────────────────────
const PX = 5; // pixels per cm

let _uid = 1;
const App = {
  panelW: 120, panelH: 180, panelDepth: 3, showGrid: true,
  lineColor: '#aaaaaa',
  warpAmount: 0,   // cm — positive bows bottom inward, negative outward
  border: { strokeWidth: 0.5, walls: { top: true, right: true, bottom: true, left: true } },
};
let layers = [];
let paperLs = {};          // id → paper.Layer
let borderPaperLayer = null;
let activeTab = 'front';   // 'front' | 'back'

// Segment counts are powers of 2: grid lines of any two layers always coincide.
const SEG_OPTS = [2, 4, 8, 16, 32];

const GEN_META = {
  straight:    { label: 'Straight',    icon: '│' },
  sine:        { label: 'Sine Wave',   icon: '∿' },
  bezier:      { label: 'Bézier',      icon: '〜' },
  arch:        { label: 'Arch',        icon: '⌒' },
  square:      { label: 'Square Wave', icon: '⊓' },
  circle:      { label: 'Circle',      icon: '○' },
};

// Generator-specific defaults. segments lives on the layer; repeats is per-generator.
const GEN_DEF = {
  straight: {},
  sine:     { amplitude: 6, cycleH: 60, visibleCycles: 0, bunch: 0, startPhase: 'center' },
  bezier:   { amplitude: 8, sharpness: 0.0, cycleH: 60, visibleCycles: 0, bunch: 0, startPhase: 'center' },
  arch:     { depth: 60, sharpness: 0.0, inset: 0 },
  square:   { amplitude: 6, cornerRadius: 0, cycleH: 60, visibleCycles: 0, bunch: 0 },
  circle:   { diameter: 20, yPos: 50 },
};

// ── Bunching helper ──────────────────────────────────────────────
// Maps normalised position t ∈ [0,1] to a bunched position in [0,1].
// k = 0  → identity (uniform spacing).
// k > 0  → exponential: cycles dense at t=0, spread out near t=1.
// k is derived from the 'bunch' param as k = bunch * 5.
function bunchY(t, k) {
  if (k <= 0) return t;
  return (Math.exp(k * t) - 1) / (Math.exp(k) - 1);
}

// ── Generators ───────────────────────────────────────────────────
// Each generator produces ONE full-height path for a single segment.
// The path is centered at x=0, spanning y=[0,H].
// x ranges from -amp to +amp; the segment boundary is ±segWidth/2.
// Amplitude beyond segWidth/2 will visually overflow (user's choice).
// drawSegments() handles horizontal repetition and mirror.

function genStraight(_p, _segWidth, H) {
  return new paper.Path([new paper.Point(0, 0), new paper.Point(0, H)]);
}

// Sine wave: fixed cycle height (cycleH cm), only complete cycles rendered.
// Starts at y=0 (x=0, zero crossing); x clamped to ±segWidth/2.
function genSine(p, segWidth, H) {
  const amp       = p.amplitude * PX;
  const halfSeg   = segWidth / 2;
  const cycleH    = p.cycleH * PX;
  const maxCycles = Math.floor(H / cycleH);
  if (maxCycles < 1) return new paper.Path();
  const nCycles = (p.visibleCycles > 0) ? Math.min(maxCycles, p.visibleCycles) : maxCycles;
  const totalH  = nCycles * cycleH;
  const k       = (p.bunch || 0) * 5;
  const phase   = p.startPhase === 'peak' ? Math.PI / 2
                : p.startPhase === 'valley' ? -Math.PI / 2 : 0;
  const N       = Math.max(60, nCycles * 40);
  const pts     = [];
  for (let s = 0; s <= N; s++) {
    const t = s / N;
    const x = Math.max(-halfSeg, Math.min(halfSeg,
                amp * Math.sin(2 * Math.PI * nCycles * t + phase)));
    pts.push(new paper.Point(x, bunchY(t, k) * totalH));
  }
  return new paper.Path(pts);
}

// Bézier: fixed cycle height (cycleH cm), only complete cycles rendered.
// Alternating cubic-bezier arches, each departing and returning to x=0.
// CP x = (4/3)*amp so the bezier peak reaches exactly amp.
function genBezier(p, segWidth, H) {
  const amp       = Math.min(p.amplitude * PX, segWidth / 2);
  const cycleH    = p.cycleH * PX;
  const maxCycles = Math.floor(H / cycleH);
  if (maxCycles < 1) return new paper.Path();
  const nCycles = (p.visibleCycles > 0) ? Math.min(maxCycles, p.visibleCycles) : maxCycles;
  const totalH  = nCycles * cycleH;
  const k       = (p.bunch || 0) * 5;
  const path    = new paper.Path();

  if (p.startPhase === 'center') {
    // ── Zero-crossing start: arches from x=0 to x=0 ─────────────
    const cpX = (4 / 3) * amp;
    path.moveTo(new paper.Point(0, 0));
    for (let c = 0; c < nCycles; c++) {
      const dir = c % 2 === 0 ? 1 : -1;
      const y0  = bunchY(c / nCycles, k) * totalH;
      const y1  = bunchY((c + 1) / nCycles, k) * totalH;
      const hv  = ((y1 - y0) / 2) * p.sharpness;
      path.cubicCurveTo(
        new paper.Point(cpX * dir, y0 + hv),
        new paper.Point(cpX * dir, y1 - hv),
        new paper.Point(0,         y1)
      );
    }
  } else {
    // ── Peak / valley start: S-curves from extreme to extreme ────
    // Each arch goes peak→valley (or valley→peak), so CP tangents are
    // vertical — cpY = cycH/3 gives the closest sine-like S-shape.
    const startX = p.startPhase === 'peak' ? amp : -amp;
    path.moveTo(new paper.Point(startX, 0));
    for (let c = 0; c < nCycles; c++) {
      const y0    = bunchY(c / nCycles, k) * totalH;
      const y1    = bunchY((c + 1) / nCycles, k) * totalH;
      const cpY   = (y1 - y0) / 3;
      const fromX = c % 2 === 0 ? startX : -startX;
      const toX   = -fromX;
      path.cubicCurveTo(
        new paper.Point(fromX, y0 + cpY),
        new paper.Point(toX,   y1 - cpY),
        new paper.Point(toX,   y1)
      );
    }
  }
  return path;
}

// Arch: single decorative arch per segment.
// Part 1 — quadratic bezier curve: departs from the top of the RIGHT segment
//   boundary (halfW, 0), sweeps down-and-left, and arrives tangentially
//   (vertically) at the LEFT boundary at y = depth.
//   sharpness 0 = round/gentle sweep, 1 = steep drop before the turn.
// Part 2 — straight line: runs straight down from the landing point to the
//   bottom of the canvas, hugging the left boundary. Inset by half the stroke
//   width so the full line thickness stays inside the segment.
// Mirrored segments (L R L R) flip the arch to start from the left boundary.
function genArch(p, segWidth, H, sw) {
  const halfW  = segWidth / 2;
  const halfSW = sw / 2;
  const hit_y  = Math.min(p.depth * PX, H - 1);
  // Control-point y: 0 = round sweep (CP near top), → hit_y = steep then sharp turn
  const y_cp   = p.sharpness * hit_y;
  // Landing x: inset by half stroke + user inset so the full stroke is inside the segment
  const xLand  = -halfW + halfSW + p.inset * PX;

  const path = new paper.Path();
  path.moveTo(new paper.Point(halfW, 0));
  // Quadratic bezier — tangency guaranteed because CP.x == xLand == landing.x
  path.quadraticCurveTo(
    new paper.Point(xLand, y_cp),
    new paper.Point(xLand, hit_y)
  );
  // Straight line down the left boundary, inside the segment
  path.lineTo(new paper.Point(xLand, H));
  return path;
}

// Square wave: fixed cycle height (cycleH cm), only complete cycles rendered.
// Alternates between x=+amp and x=-amp; cornerRadius rounds each 90° joint.
function genSquare(p, segWidth, H) {
  const amp       = Math.min(p.amplitude * PX, segWidth / 2);
  const cycleH    = p.cycleH * PX;
  const maxCycles = Math.floor(H / cycleH);
  if (maxCycles < 1) return new paper.Path();
  const nCycles = (p.visibleCycles > 0) ? Math.min(maxCycles, p.visibleCycles) : maxCycles;
  const totalH  = nCycles * cycleH;
  const k       = (p.bunch || 0) * 5;
  const K       = 0.5523;                                      // bezier quarter-circle approx

  const path = new paper.Path();
  path.moveTo(new paper.Point(amp, 0));

  for (let c = 0; c < nCycles; c++) {
    const y0    = bunchY(c / nCycles, k) * totalH;
    const y1    = bunchY((c + 1) / nCycles, k) * totalH;
    const yM    = (y0 + y1) / 2;
    const halfH = (y1 - y0) / 2;
    const r     = Math.min((p.cornerRadius || 0) * PX, halfH * 0.45, amp * 0.9);
    const last  = c === nCycles - 1;

    if (r <= 0) {
      // Sharp corners
      path.lineTo(new paper.Point( amp, yM));
      path.lineTo(new paper.Point(-amp, yM));
      path.lineTo(new paper.Point(-amp, y1));
      if (!last) path.lineTo(new paper.Point(amp, y1));
    } else {
      // Corner 1: (amp, yM) — going DOWN, turning LEFT
      path.lineTo(new paper.Point(amp, yM - r));
      path.cubicCurveTo(
        new paper.Point(amp,         yM - r + K * r),
        new paper.Point(amp - K * r, yM),
        new paper.Point(amp - r,     yM)
      );
      // Corner 2: (-amp, yM) — going LEFT, turning DOWN
      path.lineTo(new paper.Point(-amp + r, yM));
      path.cubicCurveTo(
        new paper.Point(-amp + r - K * r, yM),
        new paper.Point(-amp,             yM + K * r),
        new paper.Point(-amp,             yM + r)
      );
      if (!last) {
        // Corner 3: (-amp, y1) — going DOWN, turning RIGHT
        path.lineTo(new paper.Point(-amp, y1 - r));
        path.cubicCurveTo(
          new paper.Point(-amp,         y1 - r + K * r),
          new paper.Point(-amp + K * r, y1),
          new paper.Point(-amp + r,     y1)
        );
        // Corner 4: (amp, y1) — going RIGHT, turning DOWN
        path.lineTo(new paper.Point(amp - r, y1));
        path.cubicCurveTo(
          new paper.Point(amp - r + K * r, y1),
          new paper.Point(amp,             y1 + K * r),
          new paper.Point(amp,             y1 + r)
        );
      } else {
        path.lineTo(new paper.Point(-amp, y1));
      }
    }
  }
  return path;
}

const GEN_FNS = { straight: genStraight, sine: genSine, bezier: genBezier, arch: genArch, square: genSquare };

// Circle: one circle per segment, centred on the segment's midline.
// Uses point-sampling (same pattern as genSine) to avoid Paper.js
// Path.Circle / arcTo API quirks in 0.12.
function drawCircles(layer) {
  const { W, H } = getPx();
  const n    = layer.segments;
  const segW = W / n;
  const p    = layer.params;
  const sw   = layer.style.strokeWidth * PX;
  const mk   = pts => {
    const path = new paper.Path(pts);
    path.strokeColor = new paper.Color(App.lineColor);
    path.strokeWidth = sw; path.fillColor = null;
    path.data.color  = App.lineColor;
    return path;
  };

  for (let i = 0; i < n; i++) {
    const cx    = (i + 0.5) * segW;
    const cy    = (p.yPos / 100) * H;
    const r     = p.diameter * PX / 2;
    const halfW = segW / 2;
    if (r <= 0) continue;

    if (r <= halfW) {
      // Full circle — 64 sample points, closed
      const pts = [];
      for (let t = 0; t < 64; t++) {
        const θ = (t / 64) * 2 * Math.PI;
        pts.push(new paper.Point(cx + r * Math.cos(θ), cy + r * Math.sin(θ)));
      }
      mk(pts).closed = true;
    } else {
      // Circle wider than segment: show only the two visible arcs
      // α = angle (from positive-x axis) where the circle meets x = cx±halfW
      const α = Math.acos(halfW / r);
      const N = 40;

      // Top arc: θ from (α−π) → (−α), passes through −π/2 (top of circle)
      const topPts = [];
      for (let t = 0; t <= N; t++) {
        const θ = (α - Math.PI) + (t / N) * (Math.PI - 2 * α);
        topPts.push(new paper.Point(cx + r * Math.cos(θ), cy + r * Math.sin(θ)));
      }
      mk(topPts);

      // Bottom arc: θ from α → (π−α), passes through π/2 (bottom of circle)
      const botPts = [];
      for (let t = 0; t <= N; t++) {
        const θ = α + (t / N) * (Math.PI - 2 * α);
        botPts.push(new paper.Point(cx + r * Math.cos(θ), cy + r * Math.sin(θ)));
      }
      mk(botPts);
    }
  }
}

// ── Segment placement ─────────────────────────────────────────────
// basePath is centered at x=0. Stamp it once per segment, centered in
// each strip. Mirror (LRLR): odd segments are x-flipped around their
// strip centre. Plain (LLLL): all copies are identical.
function drawSegments(layer, basePath) {
  const { W, H } = getPx();
  const n        = layer.segments;
  const segW     = W / n;

  for (let i = 0; i < n; i++) {
    const cx   = (i + 0.5) * segW;   // centre x of this strip
    const path = basePath.clone();    // always clone — basePath stays at x=0
    path.translate(new paper.Point(cx, 0));
    const flip = layer.direction === 'RRRR' ||
                 (layer.direction === 'LRLR' && i % 2 === 1);
    // Flip horizontally around the segment centre cx.
    // Matrix(-1,0,0,1, 2*cx,0) maps x → 2*cx − x, y → y.
    if (flip) path.transform(new paper.Matrix(-1, 0, 0, 1, 2 * cx, 0));
    path.strokeColor      = new paper.Color(App.lineColor);
    path.strokeWidth      = layer.style.strokeWidth * PX;
    path.fillColor        = null;
    path.data.color       = App.lineColor;
    path.data.layerId     = layer.id;
    path.data.segCenterPx = cx;
    path.strokeCap        = 'round';
    path.strokeJoin       = 'round';
  }
  basePath.remove(); // discard the untranslated original
}

// Faint dashed vertical lines at internal segment boundaries.
// n segments → n-1 internal dividers at x = segW, 2·segW, …
function drawSegmentLines(layer) {
  const { W, H } = getPx();
  const n    = layer.segments;
  const segW = W / n;
  for (let i = 1; i < n; i++) {
    const x    = i * segW;
    const line = new paper.Path([new paper.Point(x, 0), new paper.Point(x, H)]);
    line.strokeColor = new paper.Color(0, 0, 0, 0.18);
    line.strokeWidth = 0.5;
    line.dashArray   = [5, 5];
  }
}

// ── Rendering ────────────────────────────────────────────────────
function getPx() { return { W: App.panelW * PX, H: App.panelH * PX }; }

function drawIntoLayer(layer, pl) {
  pl.activate();
  if (!layer.visible) return;
  drawSegmentLines(layer);
  if (layer.gen === 'circle') { drawCircles(layer); return; }
  const fn = GEN_FNS[layer.gen];
  if (!fn) return;
  const { W, H } = getPx();
  const segW     = W / layer.segments;
  const sw       = layer.style.strokeWidth * PX;
  const spine    = fn(layer.params, segW, H, sw);
  if (layer.flipV) spine.transform(new paper.Matrix(1, 0, 0, -1, 0, H));
  drawSegments(layer, spine);
}

function drawBorder() {
  const { W, H } = getPx();
  const sw = App.border.strokeWidth * PX;
  const { walls } = App.border;
  const seg = (x1, y1, x2, y2) => {
    const p = new paper.Path([new paper.Point(x1, y1), new paper.Point(x2, y2)]);
    p.strokeColor = new paper.Color(App.lineColor);
    p.strokeWidth = sw; p.fillColor = null;
    p.data.color  = App.lineColor;
  };
  if (walls.top)    seg(0, 0, W, 0);
  if (walls.right)  seg(W, 0, W, H);
  if (walls.left)   seg(0, 0, 0, H);
  if (walls.bottom) {
    // Draw as a 32-segment polyline so applyWarp() can deform each
    // intermediate point into the sine arch.  At x=0 and x=W, sin=0,
    // so the endpoints are always pinned — only the middle lifts/dips.
    const N = 32;
    const pts = [];
    for (let i = 0; i <= N; i++) pts.push(new paper.Point(W * i / N, H));
    const p = new paper.Path(pts);
    p.strokeColor = new paper.Color(App.lineColor);
    p.strokeWidth = sw; p.fillColor = null;
    p.data.color  = App.lineColor;
  }
}

// ── Post-processing warp ─────────────────────────────────────────
// Applies a vertical bow to every drawn path in-place.
// The top edge (y=0) is pinned; the bottom edge (y=H) is displaced by
//   A * sin(π * x / W)
// where A = App.warpAmount * PX.  Points between top and bottom
// are interpolated linearly by their y fraction.
//
// Bézier handles are warped by computing their absolute canvas position,
// applying the same displacement, then converting back to relative offsets.
// This preserves curve smoothness after the transform.
function applyWarp() {
  if (!App.warpAmount) return;
  const { W, H } = getPx();
  const A  = App.warpAmount * PX;
  const dY = (x, y) => A * Math.sin(Math.PI * x / W) * (y / H);

  paper.project.layers.forEach(pl => {
    pl.children.forEach(item => {
      if (!(item instanceof paper.Path)) return;
      item.segments.forEach(seg => {
        const px = seg.point.x,      py = seg.point.y;
        const hix = seg.handleIn.x,  hiy = seg.handleIn.y;
        const hox = seg.handleOut.x, hoy = seg.handleOut.y;

        // Warp the segment point
        const wpy = py + dY(px, py);

        // Warp handles: convert to absolute, warp, convert back to relative
        // x is never displaced — only y shifts, so relative-x stays unchanged
        seg.point     = new paper.Point(px,  wpy);
        seg.handleIn  = new paper.Point(hix, (py + hiy + dY(px + hix, py + hiy)) - wpy);
        seg.handleOut = new paper.Point(hox, (py + hoy + dY(px + hox, py + hoy)) - wpy);
      });
    });
  });
}

// Zoom the Paper.js view so the warped content always fits within the
// fixed W×H canvas pixel buffer.  Only positive warp (bow outward at
// bottom) extends beyond the natural canvas boundary; negative warp
// (concave inward) stays within bounds so no zoom change is needed.
//
// With zoom = H / (H + extra) and center = (W/2, (H+extra)/2):
//   • top-centre  (W/2, 0)        → screen (W/2, 0)          ✓
//   • bottom-centre (W/2, H+extra) → screen (W/2, H)          ✓
//   • left/right margins are symmetric                         ✓
function fitWarpedView() {
  const { W, H } = getPx();
  const extra  = Math.max(0, App.warpAmount * PX);
  const totalH = H + extra;
  paper.view.zoom   = H / totalH;
  paper.view.center = new paper.Point(W / 2, totalH / 2);
}

function fullRedraw() {
  paper.project.clear();
  paperLs = {}; borderPaperLayer = null;
  if (App.showGrid) { borderPaperLayer = new paper.Layer(); drawBorder(); }
  layers.forEach(layer => {
    const pl = new paper.Layer();
    pl.visible    = layer.visible;
    paperLs[layer.id] = pl;
    drawIntoLayer(layer, pl);
  });
  applyWarp();
  fitWarpedView();
  paper.view.update();
  refresh3DLines();
}

const _timers = {};
function schedRedraw(id) {
  clearTimeout(_timers[id]);
  _timers[id] = setTimeout(() => {
    delete _timers[id];
    // When warp is active every layer must be redrawn together so the
    // post-process pass sees freshly-flat geometry for all of them.
    if (App.warpAmount) { fullRedraw(); return; }
    const layer = layers.find(l => l.id === id);
    const pl    = paperLs[id];
    if (!layer || !pl) { fullRedraw(); return; }
    pl.removeChildren();
    pl.visible = layer.visible;
    drawIntoLayer(layer, pl);
    paper.view.update();
    refresh3DLines();
  }, 20);
}

function initCanvas() {
  paper.setup(document.getElementById('cv'));
  paper.view.autoUpdate = false;
}
function resizeCanvas() {
  const { W, H } = getPx();
  const cv = paper.view.element;
  cv.width  = W; cv.height = H;
  paper.view.viewSize = new paper.Size(W, H);
}
function fitCanvas() {
  const { W, H } = getPx();
  const scroll = document.getElementById('canvas-scroll');
  const margin = 24;
  const scale  = (scroll.clientHeight - margin * 2) / H;
  const dispW  = Math.round(W * scale);
  const cv     = paper.view.element;
  cv.style.width  = dispW + 'px';
  cv.style.height = Math.round(H * scale) + 'px';
  // Pin scroll (and therefore #view-2d) to exactly canvas + padding
  scroll.style.width = (dispW + margin * 2) + 'px';
}

// ── 3D Preview (Three.js) ─────────────────────────────────────────
let three = null;

function init3D() {
  const mount = document.getElementById('three-mount');
  const w = mount.clientWidth || 600;
  const h = mount.clientHeight || 600;

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(w, h);
  mount.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x1a1a1e);
  scene.fog = new THREE.FogExp2(0x1a1a1e, 0.0010);

  const camera = new THREE.PerspectiveCamera(40, w / h, 0.1, 5000);

  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.07;
  controls.minDistance   = 5;
  controls.maxDistance   = 3000;

  const grid = new THREE.GridHelper(2000, 40, 0x3a3a48, 0x252530);
  scene.add(grid);

  const ambLight = new THREE.AmbientLight(0xffffff, 0.55);
  scene.add(ambLight);
  const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
  dirLight.position.set(80, 160, 200);
  scene.add(dirLight);
  const fillLight = new THREE.DirectionalLight(0xaabbff, 0.3);
  fillLight.position.set(-100, -60, -80);
  scene.add(fillLight);

  three = { renderer, scene, camera, controls,
            panelEdges: null, linesGroup: null, grid, panelDepth: 3 };
  rebuild3DPanel();

  function animate() {
    requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene, camera);
  }
  animate();

  new ResizeObserver(resize3D).observe(mount);

  // Paper.js has already rendered by the time Three.js inits — populate now
  refresh3DLines();
}

function rebuild3DPanel() {
  if (!three) return;
  const { scene } = three;

  // Remove old panel edges
  if (three.panelEdges) {
    scene.remove(three.panelEdges);
    three.panelEdges.geometry.dispose();
    three.panelEdges.material.dispose();
    three.panelEdges = null;
  }

  const pW = App.panelW;
  const pH = App.panelH;
  const pD = App.panelDepth;
  three.panelDepth = pD;

  // Subtle panel frame — edges only, no filled surface
  const boxGeo  = new THREE.BoxGeometry(pW, pH, pD);
  const edgesGeo = new THREE.EdgesGeometry(boxGeo);
  boxGeo.dispose();
  three.panelEdges = new THREE.LineSegments(
    edgesGeo,
    new THREE.LineBasicMaterial({ color: 0x4a4a60 })
  );
  scene.add(three.panelEdges);

  three.grid.position.y = -pH / 2 - 0.5;

  const dist = Math.max(pW, pH) * 1.55;
  three.camera.position.set(pW * 0.45, pH * 0.2, dist);
  three.controls.target.set(0, 0, 0);
  three.controls.update();
}

// Convert Paper.js canvas coords → 3D panel (x, y) — z is handled per use
function paperToXY(px, py) {
  const { W, H } = getPx();
  return {
    x:  (px / W) * App.panelW - App.panelW / 2,
    y: -(py / H) * App.panelH + App.panelH / 2,
  };
}

// Rebuild 3D line geometry from all visible Paper.js paths
function refresh3DLines() {
  if (!three) return;

  // Dispose previous line group
  if (three.linesGroup) {
    three.scene.remove(three.linesGroup);
    three.linesGroup.traverse(obj => {
      if (obj.geometry) obj.geometry.dispose();
      if (obj.material) obj.material.dispose();
    });
  }

  const group = new THREE.Group();
  three.linesGroup = group;
  three.scene.add(group);

  // Collect visible paths: border walls first, then pattern paths (skip dashed guides)
  const paths = [];
  if (App.showGrid && borderPaperLayer) {
    borderPaperLayer.children.forEach(item => {
      if (item instanceof paper.Path && item.curves && item.curves.length > 0)
        paths.push(item);
    });
  }
  layers.forEach(layer => {
    if (!layer.visible) return;
    const pl = paperLs[layer.id];
    if (!pl) return;
    pl.children.forEach(item => {
      if (item instanceof paper.Path && item.curves && item.curves.length > 0
          && !(item.dashArray && item.dashArray.length > 0))
        paths.push(item);
    });
  });

  const depth = three.panelDepth;
  const half  = depth / 2;

  paths.forEach(path => {
    const hex   = (path.data && path.data.color) || '#aaaaaa';
    const color = new THREE.Color(hex);
    const alpha = 1;

    // Sample the path as (x, y) spine points in 3D panel space
    const spine = [];
    path.curves.forEach(c => {
      const hOut = c.segment1.handleOut;
      const hIn  = c.segment2.handleIn;
      const toV3 = (px, py) => { const {x,y} = paperToXY(px, py); return new THREE.Vector3(x, y, 0); };
      const p0 = toV3(c.segment1.point.x,          c.segment1.point.y);
      const p1 = toV3(c.segment1.point.x + hOut.x, c.segment1.point.y + hOut.y);
      const p2 = toV3(c.segment2.point.x + hIn.x,  c.segment2.point.y + hIn.y);
      const p3 = toV3(c.segment2.point.x,           c.segment2.point.y);
      const pts = new THREE.CubicBezierCurve3(p0, p1, p2, p3).getPoints(24);
      if (spine.length) pts.shift();
      spine.push(...pts);
    });

    if (spine.length < 2) return;

    // Resolve back-face x scaling for sine/square layers with independent back amplitude.
    // Amplitude only scales horizontal deviation from the segment centre — y is identical
    // on both faces (bow applies equally front and back).
    const layerId  = path.data && path.data.layerId;
    const lyr      = layerId ? layers.find(l => l.id === layerId) : null;
    const backAmp  = lyr && lyr.backParams && lyr.backParams.amplitude !== undefined
                       ? lyr.backParams.amplitude : null;
    const frontAmp = lyr ? lyr.params.amplitude : null;
    // cx3d: segment centre in 3D panel space (cm).  segCenterPx / PX = cm from left edge.
    const cx3d     = (path.data && path.data.segCenterPx != null)
                       ? path.data.segCenterPx / PX - App.panelW / 2
                       : null;
    const needScale = backAmp !== null && frontAmp !== null
                      && backAmp !== frontAmp && cx3d !== null;
    const ratio     = needScale ? (frontAmp !== 0 ? backAmp / frontAmp : 0) : 1;

    // Build a ribbon mesh: two vertices per spine point (front z=+half, back z=-half)
    const n   = spine.length;
    const pos = new Float32Array(n * 6);
    for (let i = 0; i < n; i++) {
      const p  = spine[i];
      const bx = needScale ? cx3d + (p.x - cx3d) * ratio : p.x;
      pos[i*6+0] = p.x;  pos[i*6+1] = p.y;  pos[i*6+2] =  half;  // front
      pos[i*6+3] = bx;   pos[i*6+4] = p.y;  pos[i*6+5] = -half;  // back
    }
    const idx = new Uint32Array((n-1) * 6);
    for (let i = 0; i < n-1; i++) {
      const a = i*2, b = i*2+1, c = (i+1)*2, d = (i+1)*2+1;
      idx[i*6+0]=a; idx[i*6+1]=c; idx[i*6+2]=b;
      idx[i*6+3]=b; idx[i*6+4]=c; idx[i*6+5]=d;
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    geo.setIndex(new THREE.BufferAttribute(idx, 1));
    geo.computeVertexNormals();

    const mat = new THREE.MeshStandardMaterial({
      color, side: THREE.DoubleSide,
      transparent: alpha < 0.99, opacity: alpha,
      roughness: 0.55, metalness: 0.05,
    });
    group.add(new THREE.Mesh(geo, mat));
  });
}

// ── Layer management ─────────────────────────────────────────────
function addLayer(gen) {
  const def = GEN_DEF[gen];
  const layer = {
    id:         _uid++,
    gen,
    name:       `${GEN_META[gen].label} ${layers.length + 1}`,
    visible:    true,
    segments:    4,      // number of vertical strips across the panel
    direction:   'LLLL', // 'LLLL' | 'LRLR' | 'RRRR'
    flipV:       false,
    params:     Object.assign({}, def),
    backParams: (['sine', 'square'].includes(gen) ? { amplitude: def.amplitude } : {}),
    style:      { strokeWidth: 0.3 },
  };
  layers.push(layer);
  renderLayers();
  fullRedraw();
}

function duplicateLayer(id) {
  const src = layers.find(l => l.id === id);
  if (!src) return;
  const copy  = JSON.parse(JSON.stringify(src));
  copy.id     = _uid++;
  copy.name   = src.name + ' copy';
  layers.splice(layers.indexOf(src) + 1, 0, copy);
  renderLayers();
  fullRedraw();
}

function removeLayer(id) {
  layers = layers.filter(l => l.id !== id);
  if (paperLs[id]) { paperLs[id].remove(); delete paperLs[id]; }
  renderLayers();
  paper.view.update();
}

function toggleVis(id) {
  const l = layers.find(l => l.id === id);
  if (!l) return;
  l.visible = !l.visible;
  if (paperLs[id]) paperLs[id].visible = l.visible;
  paper.view.update();
  refresh3DLines();
  renderLayers();
}

function setParam(layer, k, v) {
  if (k === 'segments' || k === 'direction' || k === 'flipV') layer[k] = v;
  else if (k.startsWith('s_')) layer.style[k.slice(2)] = v;
  else layer.params[k] = v;
}

// ── UI builders ──────────────────────────────────────────────────
function srow(lbl, k, min, max, step, val) {
  return `<div class="crow">
    <span class="clbl">${lbl}</span>
    <input class="cslider" type="range"  data-k="${k}"  min="${min}" max="${max}" step="${step}" value="${val}">
    <input class="cnum"    type="number" data-kn="${k}" min="${min}" max="${max}" step="${step}" value="${val}">
  </div>`;
}
function selrow(lbl, k, opts, val) {
  const os = opts.map(v => `<option value="${v}"${String(v) === String(val) ? ' selected' : ''}>${v}</option>`).join('');
  return `<div class="crow"><span class="clbl">${lbl}</span><select class="csel" data-k="${k}">${os}</select></div>`;
}
function crow(lbl, k, val) {
  return `<div class="crow"><span class="clbl">${lbl}</span><input type="color" class="ccol" data-k="${k}" value="${val}"></div>`;
}
function chkrow(lbl, k, checked) {
  return `<label class="cchk"><input type="checkbox" data-k="${k}"${checked ? ' checked' : ''}> ${lbl}</label>`;
}

function buildGenCtrls(layer) {
  const p = layer.params;
  if (layer.gen === 'straight') return '';
  const cycleRow   = srow('Cycle height (cm)',        'cycleH',        5,   200, 5,    p.cycleH);
  const visRow     = srow('Visible cycles (0 = all)', 'visibleCycles', 0,   40,  1,    p.visibleCycles);
  const bunchRow   = srow('Bunching',                 'bunch',         0,   1,   0.01, p.bunch);
  const phaseRow   = selrow('Phase start', 'startPhase', ['center', 'peak', 'valley'], p.startPhase);
  if (layer.gen === 'sine')
    return srow('Amplitude (cm)', 'amplitude', 0, 30, 0.5, p.amplitude)
         + phaseRow + cycleRow + visRow + bunchRow;
  if (layer.gen === 'bezier')
    return srow('Amplitude (cm)', 'amplitude', 0, 30, 0.5, p.amplitude)
         + srow('Sharpness',      'sharpness', 0, 1,  0.01, p.sharpness)
         + phaseRow + cycleRow + visRow + bunchRow;
  if (layer.gen === 'arch')
    return srow('Depth (cm)',    'depth',     1, 200,  1,    p.depth)
         + srow('Sharpness',     'sharpness', 0, 0.95, 0.05, p.sharpness)
         + srow('Side inset (cm)', 'inset',   0, 50,   0.5,  p.inset);
  if (layer.gen === 'square')
    return srow('Amplitude (cm)',      'amplitude',    0, 30, 0.5,  p.amplitude)
         + srow('Corner radius (cm)',  'cornerRadius', 0, 15, 0.25, p.cornerRadius)
         + cycleRow + visRow + bunchRow;
  if (layer.gen === 'circle')
    return srow('Diameter (cm)', 'diameter', 1, 200, 1, p.diameter)
         + srow('Height (%)',    'yPos',     0, 100, 1, p.yPos);
  return '';
}

function buildCard(layer) {
  if (activeTab === 'back') return buildBackCard(layer);
  const m  = GEN_META[layer.gen];
  const s  = layer.style;
  const gc = buildGenCtrls(layer);
  return `
    <div class="lhead">
      <span class="badge">${m.icon} ${m.label}</span>
      <span class="lname">${layer.name}</span>
      <span class="chev">›</span>
      <button class="visbtn ${layer.visible ? 'on' : 'off'}" data-vis title="Toggle visibility">◉</button>
      <button class="copybtn" data-copy title="Duplicate layer">⧉</button>
      <button class="delbtn" data-del title="Delete layer">✕</button>
    </div>
    <div class="lbody">
      <div class="csec">
        <div class="ctitle">Grid</div>
        ${selrow('Segments', 'segments', SEG_OPTS, layer.segments)}
        ${layer.gen !== 'circle' ? selrow('Direction', 'direction', ['LLLL','LRLR','RRRR'], layer.direction) : ''}
        ${layer.gen !== 'circle' ? chkrow('Flip vertical', 'flipV', layer.flipV) : ''}
      </div>
      ${gc ? `<div class="csec"><div class="ctitle">Generator</div>${gc}</div>` : ''}
      <div class="csec">
        <div class="ctitle">Style</div>
        ${srow('Stroke width (cm)', 's_strokeWidth', 0.02, 0.8, 0.02, s.strokeWidth)}
      </div>
    </div>`;
}

function buildBackCard(layer) {
  const m          = GEN_META[layer.gen];
  const hasBackAmp = layer.backParams && layer.backParams.amplitude !== undefined;
  const ctrl       = hasBackAmp
    ? `<div class="csec"><div class="ctitle">Back face</div>${srow('Amplitude (cm)', 'amplitude', 0, 30, 0.5, layer.backParams.amplitude)}</div>`
    : `<div class="csec"><span class="back-same">— same as front —</span></div>`;
  return `
    <div class="lhead">
      <span class="badge">${m.icon} ${m.label}</span>
      <span class="lname">${layer.name}</span>
      <span class="chev">›</span>
      <button class="visbtn ${layer.visible ? 'on' : 'off'}" data-vis title="Toggle visibility">◉</button>
    </div>
    <div class="lbody">${ctrl}</div>`;
}

function wireCard(card, layer) {
  if (activeTab === 'back') { wireBackCard(card, layer); return; }

  card.querySelector('.lhead').addEventListener('click', e => {
    if (e.target.closest('[data-vis]'))  { toggleVis(layer.id);      return; }
    if (e.target.closest('[data-copy]')) { duplicateLayer(layer.id); return; }
    if (e.target.closest('[data-del]'))  { removeLayer(layer.id);    return; }
    card.classList.toggle('open');
  });

  card.querySelectorAll('.cslider').forEach(sl => {
    const k   = sl.dataset.k;
    const num = card.querySelector(`[data-kn="${k}"]`);
    const upd = v => { setParam(layer, k, parseFloat(v)); schedRedraw(layer.id); };
    sl.addEventListener('input',  e => { if (num) num.value = e.target.value; upd(e.target.value); });
    if (num) num.addEventListener('change', e => { sl.value = e.target.value; upd(e.target.value); });
  });

  card.querySelectorAll('.csel').forEach(sel =>
    sel.addEventListener('change', e => {
      const raw = e.target.value;
      setParam(layer, sel.dataset.k, isNaN(raw) ? raw : +raw);
      schedRedraw(layer.id);
    }));

  card.querySelectorAll('input[type=checkbox]').forEach(el =>
    el.addEventListener('change', e => {
      setParam(layer, el.dataset.k, e.target.checked);
      schedRedraw(layer.id);
    }));
}

function wireBackCard(card, layer) {
  card.querySelector('.lhead').addEventListener('click', e => {
    if (e.target.closest('[data-vis]')) { toggleVis(layer.id); return; }
    card.classList.toggle('open');
  });
  card.querySelectorAll('.cslider').forEach(sl => {
    const k   = sl.dataset.k;
    const num = card.querySelector(`[data-kn="${k}"]`);
    const upd = v => { layer.backParams[k] = parseFloat(v); refresh3DLines(); };
    sl.addEventListener('input',  e => { if (num) num.value = e.target.value; upd(e.target.value); });
    if (num) num.addEventListener('change', e => { sl.value = e.target.value; upd(e.target.value); });
  });
}

function renderLayers() {
  const list = document.getElementById('layers-list');
  const open = new Set([...list.querySelectorAll('.lcard.open')].map(el => +el.dataset.id));
  list.innerHTML = '';
  document.getElementById('add-btn').style.display = activeTab === 'back' ? 'none' : '';
  if (!layers.length) {
    list.innerHTML = '<div class="empty-msg">No layers yet.<br>Click <strong>+ Add Layer</strong> to begin.</div>';
    return;
  }
  [...layers].reverse().forEach(layer => {
    const card       = document.createElement('div');
    card.className   = 'lcard' + (open.has(layer.id) ? ' open' : '');
    card.dataset.id  = layer.id;
    card.innerHTML   = buildCard(layer);
    wireCard(card, layer);
    list.appendChild(card);
  });
}

// ── Export / Save / Load ─────────────────────────────────────────
function dl(name, text, mime) {
  const a = Object.assign(document.createElement('a'), {
    href:     URL.createObjectURL(new Blob([text], { type: mime })),
    download: name,
  });
  a.click(); URL.revokeObjectURL(a.href);
}

function exportSVG() {
  const { W, H } = getPx();
  let svg = paper.project.exportSVG({ asString: true, bounds: 'view' });
  svg = svg.replace(/<svg([^>]*)>/,
    `<svg$1 width="${App.panelW}cm" height="${App.panelH}cm" viewBox="0 0 ${W} ${H}"><rect width="${W}" height="${H}" fill="#f4f0e8"/>`);
  dl('partition-screen.svg', svg, 'image/svg+xml');
}

function saveJSON() {
  dl('partition-screen.json',
    JSON.stringify({ panelW: App.panelW, panelH: App.panelH, warpAmount: App.warpAmount, layers }, null, 2),
    'application/json');
}

function loadJSON(file) {
  const r = new FileReader();
  r.onload = ev => {
    try {
      const d    = JSON.parse(ev.target.result);
      App.panelW      = d.panelW || 120;
      App.panelH      = d.panelH || 180;
      App.warpAmount  = d.warpAmount || 0;
      layers = d.layers || [];
      // Migration: ensure backParams exists for layers saved before this feature.
      layers.forEach(l => {
        if (!l.backParams)
          l.backParams = (['sine', 'square'].includes(l.gen) ? { amplitude: l.params.amplitude || 0 } : {});
      });
      _uid = layers.reduce((m, l) => Math.max(m, l.id), 0) + 1;
      document.getElementById('s-pw').value       = App.panelW;
      document.getElementById('s-ph').value       = App.panelH;
      document.getElementById('warp-slider').value = App.warpAmount;
      document.getElementById('warp-num').value    = App.warpAmount;
      resizeCanvas(); fitCanvas(); renderLayers(); fullRedraw(); rebuild3DPanel();
    } catch (err) { alert('Load error: ' + err.message); }
  };
  r.readAsText(file);
}

// ── Init ─────────────────────────────────────────────────────────
window.addEventListener('DOMContentLoaded', () => {
  initCanvas(); resizeCanvas(); fitCanvas(); renderLayers(); fullRedraw();
  // Delay Three.js init by one frame so layout is fully computed
  requestAnimationFrame(() => init3D());

  document.getElementById('face-tabs-bar').addEventListener('click', e => {
    const btn = e.target.closest('.ftab');
    if (!btn) return;
    activeTab = btn.dataset.tab;
    document.querySelectorAll('.ftab').forEach(b => b.classList.toggle('active', b.dataset.tab === activeTab));
    renderLayers();
  });

  const onPanel = () => {
    App.panelW = Math.max(10, +document.getElementById('s-pw').value || 120);
    App.panelH = Math.max(10, +document.getElementById('s-ph').value || 180);
    resizeCanvas(); fitCanvas(); fullRedraw(); rebuild3DPanel();
  };
  ['s-pw', 's-ph'].forEach(id => document.getElementById(id).addEventListener('change', onPanel));

  document.getElementById('s-depth').addEventListener('change', e => {
    App.panelDepth = Math.max(1, Math.min(50, +e.target.value || 3));
    e.target.value = App.panelDepth;
    rebuild3DPanel(); refresh3DLines();
  });

  const picker = document.getElementById('gen-picker');
  document.getElementById('add-btn').addEventListener('click', e => {
    e.stopPropagation(); picker.classList.toggle('hidden');
  });
  picker.querySelectorAll('[data-gen]').forEach(el =>
    el.addEventListener('click', () => { addLayer(el.dataset.gen); picker.classList.add('hidden'); }));
  document.addEventListener('click', () => picker.classList.add('hidden'));
  picker.addEventListener('click', e => e.stopPropagation());

  window.addEventListener('resize', () => { fitCanvas(); resize3D(); });

  const borderOpts = document.getElementById('border-opts');
  document.getElementById('show-grid').addEventListener('change', e => {
    App.showGrid = e.target.checked;
    borderOpts.style.display = App.showGrid ? '' : 'none';
    fullRedraw();
  });

  [['bw-top','top'],['bw-right','right'],['bw-bottom','bottom'],['bw-left','left']].forEach(([id, wall]) => {
    document.getElementById(id).addEventListener('change', e => {
      App.border.walls[wall] = e.target.checked; fullRedraw();
    });
  });

  document.getElementById('b-sw').addEventListener('change', e => {
    App.border.strokeWidth = Math.max(0.1, +e.target.value || 0.5);
    e.target.value = App.border.strokeWidth;
    fullRedraw();
  });

  document.getElementById('line-color').addEventListener('input', e => {
    App.lineColor = e.target.value;
    fullRedraw();
  });

  const warpSlider = document.getElementById('warp-slider');
  const warpNum    = document.getElementById('warp-num');
  const onWarp = v => {
    App.warpAmount   = Math.max(-30, Math.min(30, +v || 0));
    warpSlider.value = App.warpAmount;
    warpNum.value    = App.warpAmount;
    fullRedraw();
  };
  warpSlider.addEventListener('input',  e => onWarp(e.target.value));
  warpNum.addEventListener('change', e => onWarp(e.target.value));

  document.getElementById('btn-export').addEventListener('click', exportSVG);
  document.getElementById('btn-save').addEventListener('click', saveJSON);
  document.getElementById('btn-gcode').addEventListener('click', () => exportGCode());

  // Fabricate panel collapse toggle
  document.getElementById('fab-hdr').addEventListener('click', () => {
    document.getElementById('fab-sec').classList.toggle('open');
  });
  document.getElementById('fab-gc-toggle').addEventListener('click', () => {
    const panel = document.getElementById('fab-gc-panel');
    panel.classList.toggle('open');
    document.getElementById('fab-gc-toggle').textContent =
      panel.classList.contains('open') ? '▾ Custom start / end GCode' : '▸ Custom start / end GCode';
  });
  document.getElementById('file-load').addEventListener('change', e => {
    const f = e.target.files[0]; if (f) loadJSON(f); e.target.value = '';
  });

  document.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && e.key === 's') { e.preventDefault(); saveJSON(); }
    if ((e.ctrlKey || e.metaKey) && e.key === 'e') { e.preventDefault(); exportSVG(); }
  });
});
</script>
<script src="js/fabricate.js"></script>
</body>
