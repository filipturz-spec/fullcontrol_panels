<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Partition Screen Designer</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/paper.js/0.12.17/paper-full.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#1a1a1e;--sf:#26262e;--sf2:#2e2e38;--bd:#3a3a48;
  --ac:#7c6fff;--ac2:#a89bff;--tx:#e0dff8;--dm:#8888aa;
  --danger:#ff6b6b;--r:6px;
}
body{background:var(--bg);color:var(--tx);font-family:system-ui,sans-serif;font-size:13px;height:100vh;overflow:hidden}
#app{display:flex;height:100vh}
.hidden{display:none!important}

/* ── Sidebar ── */
#sidebar{width:380px;min-width:380px;background:var(--sf);border-right:1px solid var(--bd);display:flex;flex-direction:column;overflow:hidden}
.sb-hdr{padding:11px 12px;border-bottom:1px solid var(--bd);flex-shrink:0;font-weight:700;font-size:13px;color:var(--ac2);letter-spacing:.02em}
.sb-sec{padding:10px 12px;border-bottom:1px solid var(--bd);flex-shrink:0}
.sec-title{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--dm);margin-bottom:8px}
.panel-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.pi{display:flex;flex-direction:column;gap:3px}
.pi label{font-size:10px;color:var(--dm)}
.pi input{background:var(--sf2);border:1px solid var(--bd);color:var(--tx);border-radius:4px;padding:4px 6px;font-size:12px;width:100%}

/* ── Layers ── */
#layers-area{flex:1;display:flex;flex-direction:column;overflow:hidden}
#layers-toolbar{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;border-bottom:1px solid var(--bd);flex-shrink:0;position:relative}
#add-btn{background:var(--ac);color:#fff;border:none;border-radius:var(--r);padding:4px 11px;cursor:pointer;font-size:11px;font-weight:600}
#add-btn:hover{opacity:.85}
#gen-picker{position:absolute;top:calc(100% + 2px);right:12px;background:var(--sf2);border:1px solid var(--bd);border-radius:var(--r);z-index:200;min-width:170px;padding:4px 0;box-shadow:0 8px 24px rgba(0,0,0,.6)}
#gen-picker div{padding:8px 14px;cursor:pointer;font-size:12px;display:flex;align-items:center;gap:10px}
#gen-picker div:hover{background:var(--bd)}
#gen-picker .gi{font-size:17px;width:22px;text-align:center}
#layers-list{flex:1;overflow-y:auto;padding:6px}
.empty-msg{text-align:center;color:var(--dm);padding:24px 12px;font-size:12px;line-height:1.8}

/* ── Layer card ── */
.lcard{margin-bottom:4px;background:var(--sf2);border:1px solid var(--bd);border-radius:var(--r);overflow:hidden}
.lhead{display:flex;align-items:center;gap:6px;padding:7px 8px;cursor:pointer;user-select:none}
.lhead:hover{background:rgba(255,255,255,.04)}
.vis{width:14px;height:14px;border-radius:2px;border:1px solid var(--bd);display:flex;align-items:center;justify-content:center;font-size:9px;cursor:pointer;flex-shrink:0}
.vis.on{background:var(--ac);border-color:var(--ac);color:#fff}
.vis.off{color:var(--dm)}
.badge{font-size:10px;font-weight:700;text-transform:uppercase;color:var(--ac2);background:rgba(124,111,255,.15);padding:1px 5px;border-radius:3px;flex-shrink:0;letter-spacing:.04em}
.lname{flex:1;font-size:12px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chev{font-size:9px;color:var(--dm);transition:transform .15s;flex-shrink:0}
.lcard.open .chev{transform:rotate(90deg)}
.delbtn{background:none;border:none;color:var(--dm);cursor:pointer;font-size:13px;line-height:1;padding:2px 3px;border-radius:3px;flex-shrink:0}
.delbtn:hover{background:var(--danger);color:#fff}
.lbody{display:none;padding:8px 10px 10px;border-top:1px solid var(--bd)}
.lcard.open .lbody{display:block}

/* ── Controls ── */
.csec{margin-bottom:10px}
.csec:last-child{margin-bottom:0}
.ctitle{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--dm);margin-bottom:6px;padding-bottom:3px;border-bottom:1px solid var(--bd)}
.crow{display:flex;align-items:center;gap:6px;margin-bottom:5px}
.clbl{width:106px;flex-shrink:0;color:var(--dm);font-size:11px}
.cslider{flex:1;accent-color:var(--ac)}
.cnum{width:44px;background:var(--sf);border:1px solid var(--bd);color:var(--tx);border-radius:3px;padding:2px 4px;font-size:11px;text-align:right}
.csel{flex:1;background:var(--sf);border:1px solid var(--bd);color:var(--tx);border-radius:3px;padding:3px 5px;font-size:11px}
.ccol{flex:1;height:24px;border:none;background:none;cursor:pointer;border-radius:3px}
.cchk{display:flex;align-items:center;gap:8px;margin-bottom:5px;font-size:11px;color:var(--dm);cursor:pointer}
.cchk input{accent-color:var(--ac)}

/* ── Footer ── */
#sb-foot{padding:8px 10px;border-top:1px solid var(--bd);display:flex;gap:5px;flex-shrink:0}
#sb-foot button,.load-lbl{flex:1;background:var(--sf2);border:1px solid var(--bd);color:var(--tx);border-radius:var(--r);padding:5px 4px;font-size:10px;cursor:pointer;text-align:center;white-space:nowrap}
#sb-foot button:hover,.load-lbl:hover{border-color:var(--ac);color:var(--ac)}
#btn-export{font-weight:600}

/* ── Canvas area ── */
#canvas-wrap{flex:1;display:flex;flex-direction:column;overflow:hidden;background:var(--bg)}
#canvas-toolbar{height:38px;display:flex;align-items:center;gap:14px;padding:0 14px;border-bottom:1px solid var(--bd);background:var(--sf);flex-shrink:0;font-size:11px;color:var(--dm)}
#canvas-toolbar label{display:flex;align-items:center;gap:5px;white-space:nowrap}
#canvas-toolbar input[type=range]{width:80px;accent-color:var(--ac)}
#zoom-label{min-width:30px}
#canvas-scroll{flex:1;overflow:auto;padding:30px;display:flex;justify-content:center;align-items:flex-start}
#canvas-inner{display:inline-block;box-shadow:0 4px 32px rgba(0,0,0,.7);transform-origin:top left}
canvas{display:block;background:#f4f0e8}
::-webkit-scrollbar{width:5px;height:5px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--bd);border-radius:3px}
</style>
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="sb-hdr">Screen Designer</div>

    <div class="sb-sec">
      <div class="sec-title">Panel</div>
      <div class="panel-grid">
        <div class="pi"><label>Width (cm)</label><input id="s-pw" type="number" value="120" min="10" max="600"></div>
        <div class="pi"><label>Height (cm)</label><input id="s-ph" type="number" value="180" min="10" max="600"></div>
      </div>
    </div>

    <div id="layers-area">
      <div id="layers-toolbar">
        <span class="sec-title" style="margin:0">Layers</span>
        <button id="add-btn">+ Add Layer</button>
        <div id="gen-picker" class="hidden">
          <div data-gen="straight"><span class="gi">│</span>Straight</div>
          <div data-gen="sine"><span class="gi">∿</span>Sine Wave</div>
          <div data-gen="arch"><span class="gi">⌒</span>Arch</div>
          <div data-gen="square"><span class="gi">⊓</span>Square Wave</div>
        </div>
      </div>
      <div id="layers-list">
        <div class="empty-msg">No layers yet.<br>Click <strong>+ Add Layer</strong> to begin.</div>
      </div>
    </div>

    <div id="sb-foot">
      <button id="btn-export">Export SVG</button>
      <button id="btn-save">Save JSON</button>
      <label class="load-lbl">Load JSON<input type="file" id="file-load" accept=".json" style="display:none"></label>
    </div>
  </aside>

  <main id="canvas-wrap">
    <div id="canvas-toolbar">
      <label>Zoom <input type="range" id="zoom-sl" min="20" max="200" value="60" step="5"> <span id="zoom-label">60%</span></label>
      <label style="margin-left:auto"><input type="checkbox" id="show-grid" checked> Border</label>
    </div>
    <div id="canvas-scroll">
      <div id="canvas-inner"><canvas id="cv"></canvas></div>
    </div>
  </main>
</div>

<script>
'use strict';

// ── Constants & state ────────────────────────────────────────────
const PX = 5; // pixels per cm

let _uid = 1;
const App = { panelW: 120, panelH: 180, showGrid: true, zoom: 60 };
let layers = [];
let paperLs = {}; // id → paper.Layer

// Segment counts are powers of 2: grid lines of any two layers always coincide.
const SEG_OPTS = [2, 4, 8, 16, 32];

const GEN_META = {
  straight: { label: 'Straight',    icon: '│' },
  sine:     { label: 'Sine Wave',   icon: '∿' },
  arch:     { label: 'Arch',        icon: '⌒' },
  square:   { label: 'Square Wave', icon: '⊓' },
};

// Generator-specific defaults. segments lives on the layer; repeats is per-generator.
const GEN_DEF = {
  straight: {},
  sine:     { amplitude: 6, repeats: 3 },
  arch:     { amplitude: 8, sharpness: 0.0, repeats: 3 },
  square:   { amplitude: 6, cornerRadius: 0, repeats: 3 },
};

// ── Generators ───────────────────────────────────────────────────
// Each generator produces ONE full-height path for a single segment.
// The path is centered at x=0, spanning y=[0,H].
// x ranges from -amp to +amp; the segment boundary is ±segWidth/2.
// Amplitude beyond segWidth/2 will visually overflow (user's choice).
// drawSegments() handles horizontal repetition and mirror.

function genStraight(_p, _segWidth, H) {
  return new paper.Path([new paper.Point(0, 0), new paper.Point(0, H)]);
}

// Full sine wave centered at x=0: `repeats` complete cycles top→bottom.
// x = amp * sin(2π * repeats * t), clamped to ±segWidth/2.
// When amp > halfSeg the wave travels along the boundary (flat-top).
function genSine(p, segWidth, H) {
  const amp     = p.amplitude * PX;
  const halfSeg = segWidth / 2;
  const N       = Math.max(60, p.repeats * 40);
  const pts     = [];
  for (let s = 0; s <= N; s++) {
    const t = s / N;
    const x = Math.max(-halfSeg, Math.min(halfSeg,
                amp * Math.sin(2 * Math.PI * p.repeats * t)));
    pts.push(new paper.Point(x, t * H));
  }
  return new paper.Path(pts);
}

// `repeats` cubic-bezier arches, alternating left-right, top→bottom.
// Each arch departs and returns to the centre line (x=0).
// sharpness 0 = smooth round arch (CPs at ends),
//            1 = pointed/gothic arch (CPs pulled toward midpoint).
// CP x-coords = (4/3)*amp so the bezier peak actually reaches amp.
function genArch(p, segWidth, H) {
  const amp   = Math.min(p.amplitude * PX, segWidth / 2);
  const cellH = H / p.repeats;
  const cpX   = (4 / 3) * amp;                     // ensures peak == amp
  const path  = new paper.Path();
  path.moveTo(new paper.Point(0, 0));
  for (let c = 0; c < p.repeats; c++) {
    const dir = c % 2 === 0 ? 1 : -1;
    const y0  = c * cellH;
    const y1  = y0 + cellH;
    const hv  = (cellH / 2) * p.sharpness;         // 0 = round, 1 = pointed
    path.cubicCurveTo(
      new paper.Point(cpX * dir, y0 + hv),
      new paper.Point(cpX * dir, y1 - hv),
      new paper.Point(0,         y1)
    );
  }
  return path;
}

// True square wave: alternates between x=+amp and x=-amp every half-period.
// cornerRadius (cm) rounds each 90-degree joint with a bezier arc.
function genSquare(p, segWidth, H) {
  const amp   = Math.min(p.amplitude * PX, segWidth / 2);
  const halfH = H / (p.repeats * 2);                        // height of one half-period
  const r     = Math.min((p.cornerRadius || 0) * PX,        // clamped corner radius
                         halfH * 0.45, amp * 0.9);
  const K     = 0.5523;                                      // bezier quarter-circle approx

  const path = new paper.Path();
  path.moveTo(new paper.Point(amp, 0));

  for (let c = 0; c < p.repeats; c++) {
    const y0 = c * halfH * 2;
    const yM = y0 + halfH;
    const y1 = y0 + halfH * 2;
    const last = c === p.repeats - 1;

    if (r <= 0) {
      // Sharp corners
      path.lineTo(new paper.Point( amp, yM));
      path.lineTo(new paper.Point(-amp, yM));
      path.lineTo(new paper.Point(-amp, y1));
      if (!last) path.lineTo(new paper.Point(amp, y1));
    } else {
      // Corner 1: (amp, yM) — going DOWN, turning LEFT
      path.lineTo(new paper.Point(amp, yM - r));
      path.cubicCurveTo(
        new paper.Point(amp,         yM - r + K * r),
        new paper.Point(amp - K * r, yM),
        new paper.Point(amp - r,     yM)
      );
      // Corner 2: (-amp, yM) — going LEFT, turning DOWN
      path.lineTo(new paper.Point(-amp + r, yM));
      path.cubicCurveTo(
        new paper.Point(-amp + r - K * r, yM),
        new paper.Point(-amp,             yM + K * r),
        new paper.Point(-amp,             yM + r)
      );
      if (!last) {
        // Corner 3: (-amp, y1) — going DOWN, turning RIGHT
        path.lineTo(new paper.Point(-amp, y1 - r));
        path.cubicCurveTo(
          new paper.Point(-amp,         y1 - r + K * r),
          new paper.Point(-amp + K * r, y1),
          new paper.Point(-amp + r,     y1)
        );
        // Corner 4: (amp, y1) — going RIGHT, turning DOWN
        path.lineTo(new paper.Point(amp - r, y1));
        path.cubicCurveTo(
          new paper.Point(amp - r + K * r, y1),
          new paper.Point(amp,             y1 + K * r),
          new paper.Point(amp,             y1 + r)
        );
      } else {
        path.lineTo(new paper.Point(-amp, y1));
      }
    }
  }
  return path;
}

const GEN_FNS = { straight: genStraight, sine: genSine, arch: genArch, square: genSquare };

// ── Segment placement ─────────────────────────────────────────────
// basePath is centered at x=0. Stamp it once per segment, centered in
// each strip. Mirror (LRLR): odd segments are x-flipped around their
// strip centre. Plain (LLLL): all copies are identical.
function drawSegments(layer, basePath) {
  const { W, H } = getPx();
  const n        = layer.segments;
  const segW     = W / n;

  for (let i = 0; i < n; i++) {
    const cx   = (i + 0.5) * segW;   // centre x of this strip
    const path = basePath.clone();    // always clone — basePath stays at x=0
    path.translate(new paper.Point(cx, 0));
    if (layer.mirror && i % 2 === 1) path.scale(-1, 1, new paper.Point(cx, H / 2));
    path.strokeColor = new paper.Color(layer.style.color);
    path.strokeWidth = layer.style.strokeWidth * PX;
    path.fillColor   = null;
    path.strokeCap   = 'round';
    path.strokeJoin  = 'round';
  }
  basePath.remove(); // discard the untranslated original
}

// Faint dashed vertical lines at internal segment boundaries.
// n segments → n-1 internal dividers at x = segW, 2·segW, …
function drawSegmentLines(layer) {
  const { W, H } = getPx();
  const n    = layer.segments;
  const segW = W / n;
  for (let i = 1; i < n; i++) {
    const x    = i * segW;
    const line = new paper.Path([new paper.Point(x, 0), new paper.Point(x, H)]);
    line.strokeColor = new paper.Color(0, 0, 0, 0.18);
    line.strokeWidth = 0.5;
    line.dashArray   = [5, 5];
  }
}

// ── Rendering ────────────────────────────────────────────────────
function getPx() { return { W: App.panelW * PX, H: App.panelH * PX }; }

function drawIntoLayer(layer, pl) {
  pl.activate();
  if (!layer.visible) return;
  drawSegmentLines(layer);
  const fn = GEN_FNS[layer.gen];
  if (!fn) return;
  const { W, H } = getPx();
  const segW     = W / layer.segments;
  const spine    = fn(layer.params, segW, H);
  drawSegments(layer, spine);
}

function drawBorder() {
  const { W, H } = getPx();
  const b = new paper.Path.Rectangle(new paper.Rectangle(0, 0, W, H));
  b.strokeColor = new paper.Color(0, 0, 0, 0.3);
  b.strokeWidth = 1.5;
  b.fillColor   = null;
}

function fullRedraw() {
  paper.project.clear();
  paperLs = {};
  if (App.showGrid) { new paper.Layer(); drawBorder(); }
  layers.forEach(layer => {
    const pl = new paper.Layer();
    pl.visible    = layer.visible;
    paperLs[layer.id] = pl;
    drawIntoLayer(layer, pl);
  });
  paper.view.update();
}

const _timers = {};
function schedRedraw(id) {
  clearTimeout(_timers[id]);
  _timers[id] = setTimeout(() => {
    delete _timers[id];
    const layer = layers.find(l => l.id === id);
    const pl    = paperLs[id];
    if (!layer || !pl) { fullRedraw(); return; }
    pl.removeChildren();
    pl.visible = layer.visible;
    drawIntoLayer(layer, pl);
    paper.view.update();
  }, 20);
}

function initCanvas() {
  paper.setup(document.getElementById('cv'));
  paper.view.autoUpdate = false;
}
function resizeCanvas() {
  const { W, H } = getPx();
  const cv = paper.view.element;
  cv.width  = W; cv.height = H;
  paper.view.viewSize = new paper.Size(W, H);
}
function applyZoom(z) {
  const inner = document.getElementById('canvas-inner');
  const { W, H } = getPx();
  inner.style.width           = W + 'px';
  inner.style.height          = H + 'px';
  inner.style.transform       = `scale(${z / 100})`;
  inner.style.transformOrigin = 'top left';
}

// ── Layer management ─────────────────────────────────────────────
function addLayer(gen) {
  const layer = {
    id:       _uid++,
    gen,
    name:     `${GEN_META[gen].label} ${layers.length + 1}`,
    visible:  true,
    segments: 4,   // number of vertical strips across the panel
    mirror:   true,
    params:   Object.assign({}, GEN_DEF[gen]),
    style:    { color: '#5c3d1e', strokeWidth: 0.3 },
  };
  layers.push(layer);
  renderLayers();
  fullRedraw();
}

function removeLayer(id) {
  layers = layers.filter(l => l.id !== id);
  if (paperLs[id]) { paperLs[id].remove(); delete paperLs[id]; }
  renderLayers();
  paper.view.update();
}

function toggleVis(id) {
  const l = layers.find(l => l.id === id);
  if (!l) return;
  l.visible = !l.visible;
  if (paperLs[id]) paperLs[id].visible = l.visible;
  paper.view.update();
  renderLayers();
}

function setParam(layer, k, v) {
  if (k === 'segments' || k === 'mirror') layer[k] = v;
  else if (k.startsWith('s_')) layer.style[k.slice(2)] = v;
  else layer.params[k] = v;
}

// ── UI builders ──────────────────────────────────────────────────
function srow(lbl, k, min, max, step, val) {
  return `<div class="crow">
    <span class="clbl">${lbl}</span>
    <input class="cslider" type="range"  data-k="${k}"  min="${min}" max="${max}" step="${step}" value="${val}">
    <input class="cnum"    type="number" data-kn="${k}" min="${min}" max="${max}" step="${step}" value="${val}">
  </div>`;
}
function selrow(lbl, k, opts, val) {
  const os = opts.map(v => `<option value="${v}"${+v === +val ? ' selected' : ''}>${v}</option>`).join('');
  return `<div class="crow"><span class="clbl">${lbl}</span><select class="csel" data-k="${k}">${os}</select></div>`;
}
function crow(lbl, k, val) {
  return `<div class="crow"><span class="clbl">${lbl}</span><input type="color" class="ccol" data-k="${k}" value="${val}"></div>`;
}
function chkrow(lbl, k, checked) {
  return `<label class="cchk"><input type="checkbox" data-k="${k}"${checked ? ' checked' : ''}> ${lbl}</label>`;
}

function buildGenCtrls(layer) {
  const p = layer.params;
  if (layer.gen === 'straight') return '';
  const repeats = srow('Repeats', 'repeats', 1, 20, 1, p.repeats);
  if (layer.gen === 'sine')
    return srow('Amplitude (cm)', 'amplitude', 0, 30, 0.5, p.amplitude)
         + repeats;
  if (layer.gen === 'arch')
    return srow('Amplitude (cm)', 'amplitude', 0, 30, 0.5, p.amplitude)
         + srow('Sharpness',      'sharpness', 0, 1, 0.01, p.sharpness)
         + repeats;
  if (layer.gen === 'square')
    return srow('Amplitude (cm)',      'amplitude',    0, 30, 0.5,  p.amplitude)
         + srow('Corner radius (cm)',  'cornerRadius', 0, 15, 0.25, p.cornerRadius)
         + repeats;
  return '';
}

function buildCard(layer) {
  const m  = GEN_META[layer.gen];
  const s  = layer.style;
  const gc = buildGenCtrls(layer);
  return `
    <div class="lhead">
      <div class="vis ${layer.visible ? 'on' : 'off'}" data-vis>●</div>
      <span class="badge">${m.icon} ${m.label}</span>
      <span class="lname">${layer.name}</span>
      <span class="chev">›</span>
      <button class="delbtn" data-del>✕</button>
    </div>
    <div class="lbody">
      <div class="csec">
        <div class="ctitle">Grid</div>
        ${selrow('Segments', 'segments', SEG_OPTS, layer.segments)}
        ${chkrow('Mirror (L R L R)', 'mirror', layer.mirror)}
      </div>
      ${gc ? `<div class="csec"><div class="ctitle">Generator</div>${gc}</div>` : ''}
      <div class="csec">
        <div class="ctitle">Style</div>
        ${crow('Color', 's_color', s.color)}
        ${srow('Stroke width (cm)', 's_strokeWidth', 0.02, 0.8, 0.02, s.strokeWidth)}
      </div>
    </div>`;
}

function wireCard(card, layer) {
  card.querySelector('.lhead').addEventListener('click', e => {
    if (e.target.closest('[data-vis]')) { toggleVis(layer.id); return; }
    if (e.target.closest('[data-del]')) { removeLayer(layer.id); return; }
    card.classList.toggle('open');
  });

  card.querySelectorAll('.cslider').forEach(sl => {
    const k   = sl.dataset.k;
    const num = card.querySelector(`[data-kn="${k}"]`);
    const upd = v => { setParam(layer, k, parseFloat(v)); schedRedraw(layer.id); };
    sl.addEventListener('input',  e => { if (num) num.value = e.target.value; upd(e.target.value); });
    if (num) num.addEventListener('change', e => { sl.value = e.target.value; upd(e.target.value); });
  });

  card.querySelectorAll('.csel').forEach(sel =>
    sel.addEventListener('change', e => {
      setParam(layer, sel.dataset.k, +e.target.value);
      schedRedraw(layer.id);
    }));

  card.querySelectorAll('.ccol').forEach(el =>
    el.addEventListener('input', e => {
      setParam(layer, el.dataset.k, e.target.value);
      schedRedraw(layer.id);
    }));

  card.querySelectorAll('input[type=checkbox]').forEach(el =>
    el.addEventListener('change', e => {
      setParam(layer, el.dataset.k, e.target.checked);
      schedRedraw(layer.id);
    }));
}

function renderLayers() {
  const list = document.getElementById('layers-list');
  const open = new Set([...list.querySelectorAll('.lcard.open')].map(el => +el.dataset.id));
  list.innerHTML = '';
  if (!layers.length) {
    list.innerHTML = '<div class="empty-msg">No layers yet.<br>Click <strong>+ Add Layer</strong> to begin.</div>';
    return;
  }
  [...layers].reverse().forEach(layer => {
    const card       = document.createElement('div');
    card.className   = 'lcard' + (open.has(layer.id) ? ' open' : '');
    card.dataset.id  = layer.id;
    card.innerHTML   = buildCard(layer);
    wireCard(card, layer);
    list.appendChild(card);
  });
}

// ── Export / Save / Load ─────────────────────────────────────────
function dl(name, text, mime) {
  const a = Object.assign(document.createElement('a'), {
    href:     URL.createObjectURL(new Blob([text], { type: mime })),
    download: name,
  });
  a.click(); URL.revokeObjectURL(a.href);
}

function exportSVG() {
  const { W, H } = getPx();
  let svg = paper.project.exportSVG({ asString: true, bounds: 'view' });
  svg = svg.replace(/<svg([^>]*)>/,
    `<svg$1 width="${App.panelW}cm" height="${App.panelH}cm" viewBox="0 0 ${W} ${H}"><rect width="${W}" height="${H}" fill="#f4f0e8"/>`);
  dl('partition-screen.svg', svg, 'image/svg+xml');
}

function saveJSON() {
  dl('partition-screen.json',
    JSON.stringify({ panelW: App.panelW, panelH: App.panelH, layers }, null, 2),
    'application/json');
}

function loadJSON(file) {
  const r = new FileReader();
  r.onload = ev => {
    try {
      const d    = JSON.parse(ev.target.result);
      App.panelW = d.panelW || 120;
      App.panelH = d.panelH || 180;
      layers     = d.layers || [];
      _uid       = layers.reduce((m, l) => Math.max(m, l.id), 0) + 1;
      document.getElementById('s-pw').value = App.panelW;
      document.getElementById('s-ph').value = App.panelH;
      resizeCanvas(); applyZoom(App.zoom); renderLayers(); fullRedraw();
    } catch (err) { alert('Load error: ' + err.message); }
  };
  r.readAsText(file);
}

// ── Init ─────────────────────────────────────────────────────────
window.addEventListener('DOMContentLoaded', () => {
  initCanvas(); resizeCanvas(); applyZoom(App.zoom); renderLayers(); fullRedraw();

  const onPanel = () => {
    App.panelW = Math.max(10, +document.getElementById('s-pw').value || 120);
    App.panelH = Math.max(10, +document.getElementById('s-ph').value || 180);
    resizeCanvas(); applyZoom(App.zoom); fullRedraw();
  };
  ['s-pw', 's-ph'].forEach(id => document.getElementById(id).addEventListener('change', onPanel));

  const picker = document.getElementById('gen-picker');
  document.getElementById('add-btn').addEventListener('click', e => {
    e.stopPropagation(); picker.classList.toggle('hidden');
  });
  picker.querySelectorAll('[data-gen]').forEach(el =>
    el.addEventListener('click', () => { addLayer(el.dataset.gen); picker.classList.add('hidden'); }));
  document.addEventListener('click', () => picker.classList.add('hidden'));
  picker.addEventListener('click', e => e.stopPropagation());

  const zoomSl  = document.getElementById('zoom-sl');
  const zoomLbl = document.getElementById('zoom-label');
  zoomSl.addEventListener('input', e => {
    App.zoom = +e.target.value;
    zoomLbl.textContent = App.zoom + '%';
    applyZoom(App.zoom);
  });

  document.getElementById('show-grid').addEventListener('change', e => {
    App.showGrid = e.target.checked; fullRedraw();
  });

  document.getElementById('btn-export').addEventListener('click', exportSVG);
  document.getElementById('btn-save').addEventListener('click', saveJSON);
  document.getElementById('file-load').addEventListener('change', e => {
    const f = e.target.files[0]; if (f) loadJSON(f); e.target.value = '';
  });

  document.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && e.key === 's') { e.preventDefault(); saveJSON(); }
    if ((e.ctrlKey || e.metaKey) && e.key === 'e') { e.preventDefault(); exportSVG(); }
  });
});
</script>
